<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=add_notes" />

    <title>Cadastro de Clientes Estética</title>
</head>

<body>

            <a href=""><img src="Imagem/instagram.png" alt="instagram" class="ImagemRedeSocial"></a>
        </div>
        <div class="ContainerBarraDeInput">
            <input type="text" placeholder="Nome do cliente/CPF">

        <div class="ContainerCadastroPessoa">

    <!--Lista de Pessoas-->
