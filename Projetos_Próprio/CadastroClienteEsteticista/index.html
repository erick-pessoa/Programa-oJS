<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=add_notes" />

    <title>Cadastro de Clientes Estética</title>
</head>

<body>
    <!--Painel de cadastro/Pesquisa/Rede Sociais-->
    <div class="ContainerPainel">
        <div class="ContainerRedeSociais">
            <a href=""><img src="Imagem/facebook.png" alt="Facebook" class="ImagemRedeSocial"></a>
            <a href=""><img src="Imagem/instagram.png" alt="instagram" class="ImagemRedeSocial"></a>
        </div>
        <div class="ContainerBarraDeInput">
            <input type="text" placeholder="Nome do cliente/CPF">
        </div>
        <div class="ContainerCadastroPessoa">
            <span class="material-symbols-outlined btn-cadastrar">
                add_notes
            </span>
        </div>
    </div>

    <div class="Janela_cliente FechaJanela">
        <form action="">

            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Nome do Cliente">

            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="cpf" placeholder="CPF do Cliente">

            <label for=" cpf">Email:</label>
            <input type="email" id="email" name="email" placeholder="Email do Cliente">

            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" placeholder="Digite o telefone">

          <label for="textClient">Descrição do Cliente</label>
          <textarea name="textClient" ></textarea>

        </form>

        <div class="ContainerBotoes">
            <button id="btn-salvar">Salvar</button>
            <button id ="btn-cancelar">Cancelar</button>
        </div>

    </div>

    <!--Lista de Pessoas-->
    <div class="ContainerListaPessoas">
        <h1 id="titulo">Lista de Pessoas</h1>
        <ul>
             
                <li>CPF</li>
                <li>Nome</li>
                <li>Email</li>
                <li>Telefone</li>
                <li>Descrição</li>      
                  
        </ul>
    </div>
</body>

</html>
